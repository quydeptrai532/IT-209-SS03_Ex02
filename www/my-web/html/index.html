<!doctype html>
<html lang="vi">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>My Web</title>
    <style>
      body { font-family: system-ui, sans-serif; background: #f8fafc; color: #0f172a; margin: 0; }
      .wrap { max-width: 640px; margin: 14vh auto; padding: 32px; background: #fff;
              border-radius: 12px; box-shadow: 0 8px 24px rgba(0,0,0,.08); text-align: center; }
      h1 { margin: 0 0 8px; color: #1d4ed8; }
      code { background: #f1f5f9; padding: 2px 6px; border-radius: 6px; }
    </style>
  </head>
  <body>
    <div class="wrap">
      <h1>My Web</h1>
      <p>Trang chủ website tĩnh tại <code>/var/www/my-web/html/</code>.</p>
      <p>Thử truy cập một đường dẫn sai, ví dụ <code>/invalid-path-demo</code>, để xem trang lỗi 404 tùy chỉnh.</p>
    </div>
  </body>
</html>
