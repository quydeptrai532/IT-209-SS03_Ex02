<!doctype html>
<html lang="vi">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>404 - Không tìm thấy trang</title>
    <style>
      * { box-sizing: border-box; }
      body {
        margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center;
        font-family: system-ui, -apple-system, Segoe UI, Roboto, sans-serif;
        background: linear-gradient(135deg, #1e3a8a 0%, #3b82f6 100%);
        color: #0f172a;
      }
      .card {
        background: #fff; padding: 48px 40px; border-radius: 16px; text-align: center;
        max-width: 460px; box-shadow: 0 20px 50px rgba(0,0,0,.25);
      }
      .code { font-size: 88px; font-weight: 800; line-height: 1; color: #3b82f6; letter-spacing: 2px; }
      h1 { margin: 12px 0 8px; font-size: 22px; }
      p { margin: 0 0 24px; color: #475569; line-height: 1.6; }
      a.btn {
        display: inline-block; padding: 12px 24px; border-radius: 10px;
        background: #3b82f6; color: #fff; text-decoration: none; font-weight: 600;
      }
      a.btn:hover { background: #2563eb; }
    </style>
  </head>
  <body>
    <div class="card">
      <div class="code">404</div>
      <h1>Ối! Không tìm thấy trang</h1>
      <p>Đường dẫn bạn truy cập không tồn tại hoặc đã bị di chuyển.<br>
         Vui lòng kiểm tra lại địa chỉ hoặc quay về trang chủ.</p>
      <a class="btn" href="/">Về trang chủ</a>
    </div>
  </body>
</html>
