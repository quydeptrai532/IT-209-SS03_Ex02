# Bài 2 (Session 03) - Trang lỗi 404 tùy chỉnh
# /etc/nginx/sites-available/my-web.conf

server {
    listen 80;
    listen [::]:80;
    server_name _;

    root /var/www/my-web/html;
    index index.html;

    # Trang lỗi 404 tùy chỉnh
    error_page 404 /404.html;

    # Chặn truy cập trực tiếp /404.html từ Internet
    location = /404.html {
        root /var/www/my-web/html;
        internal;
    }

    location / {
        try_files $uri $uri/ =404;
    }

    access_log /var/log/nginx/my-web.access.log;
    error_log  /var/log/nginx/my-web.error.log;
}
